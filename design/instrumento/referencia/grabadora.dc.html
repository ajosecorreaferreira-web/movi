<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Instrumento · Grabar saludo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@200..700&amp;family=Martian+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #2B4FD8;outline-offset:2px}
.tecla{transition:transform 60ms,box-shadow 60ms}
.tecla:active{transform:translateY(3px);box-shadow:none!important}
@keyframes rec{0%,100%{opacity:1}50%{opacity:.3}}
.rec{animation:rec 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.rec{animation:none}.carrete{transition:none!important;transform:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EEEEEC;color:#111111;font-family:'Archivo',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <header style="display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0">
    <button aria-label="Cerrar" style="width:44px;height:44px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <span style="font-family:'Martian Mono',monospace;font-size:11px;letter-spacing:0.08em">{{cabecera}}</span>
    <span style="width:44px"></span>
  </header>

  <div style="padding:6px 20px 0;display:flex;flex-direction:column;gap:8px">
    <sc-if value="{{conAna}}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:10px">
        <div aria-hidden="true" style="width:32px;height:32px;border-radius:6px;background:#FF5B1A;color:#111;display:flex;align-items:center;justify-content:center;font-family:'Martian Mono',monospace;font-size:13px">A</div>
        <span style="font-family:'Martian Mono',monospace;font-size:10.5px;letter-spacing:0.08em">PARA ANA · MAÑANA 8:00 · PINAR</span>
      </div>
    </sc-if>
    <h1 style="margin:0;font-weight:250;font-size:31px;line-height:1.05;letter-spacing:-0.02em">{{titulo}}</h1>
    <p style="margin:0;font-size:14.5px;line-height:1.45;color:#3A3A3A">{{guia}}</p>
  </div>

  <main style="flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 20px 0">

    <div role="timer" aria-live="polite" aria-label="{{ariaAnillo}}" style="position:relative;width:216px;height:216px;flex-shrink:0">
      <div class="carrete" aria-hidden="true" style="position:absolute;inset:0;transform:rotate({{giro}}deg);transition:transform 100ms linear">
        <sc-for list="{{anillo}}" as="d" hint-placeholder-count="40">
          <span style="position:absolute;left:{{d.x}}px;top:{{d.y}}px;width:{{d.s}}px;height:{{d.s}}px;border-radius:50%;background:{{d.c}};box-shadow:{{d.g}}"></span>
        </sc-for>
        <span style="position:absolute;left:104px;top:20px;width:8px;height:8px;border-radius:50%;background:#CFCFCB"></span>
        <span style="position:absolute;left:104px;top:188px;width:8px;height:8px;border-radius:50%;background:#CFCFCB"></span>
        <span style="position:absolute;left:20px;top:104px;width:8px;height:8px;border-radius:50%;background:#CFCFCB"></span>
        <span style="position:absolute;left:188px;top:104px;width:8px;height:8px;border-radius:50%;background:#CFCFCB"></span>
      </div>
      <div aria-hidden="true" style="position:absolute;inset:44px;border-radius:50%;background:#F7F7F5;border:1px solid #CFCFCB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
        <span style="font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:0.1em;color:#5A5A5A">{{etiquetaCentro}}</span>
        <span style="font-weight:250;font-size:50px;line-height:1;letter-spacing:-0.03em">{{cifra}}</span>
      </div>
    </div>

    <section aria-label="Cinta" style="width:100%;box-sizing:border-box;background:#0F0E12;color:#F2F2F0;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;font-family:'Martian Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:#9A9A9A">
        <span style="display:flex;align-items:center;gap:8px"><span class="{{claseLed}}" aria-hidden="true" style="width:8px;height:8px;border-radius:50%;background:{{led}};box-shadow:{{ledBrillo}}"></span><span style="color:#F2F2F0">{{estado}}</span></span>
        <span>MÁX 0:20</span>
      </div>
      <div aria-hidden="true" style="display:flex;align-items:center;gap:2px;height:44px">
        <sc-for list="{{barras}}" as="b" hint-placeholder-count="40"><div style="flex:1;height:{{b.h}}%;min-height:2px;border-radius:1px;background:{{b.c}}"></div></sc-for>
      </div>
      <sc-if value="{{recortando}}" hint-placeholder-val="{{ false }}">
        <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:4px">
            <button class="tecla" aria-label="Empezar antes" onClick="{{inicioMenos}}" style="width:44px;height:44px;border:1px solid #3A3A3A;border-radius:6px;background:#1C1B20;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
            <span style="display:flex;flex-direction:column;align-items:center;font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:0.06em;color:#CFCFCB">INICIO<span style="color:#F2F2F0">{{inicioTxt}}</span></span>
            <button class="tecla" aria-label="Empezar después" onClick="{{inicioMas}}" style="width:44px;height:44px;border:1px solid #3A3A3A;border-radius:6px;background:#1C1B20;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:4px">
            <button class="tecla" aria-label="Terminar antes" onClick="{{finMenos}}" style="width:44px;height:44px;border:1px solid #3A3A3A;border-radius:6px;background:#1C1B20;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
            <span style="display:flex;flex-direction:column;align-items:center;font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:0.06em;color:#CFCFCB">FINAL<span style="color:#F2F2F0">{{finTxt}}</span></span>
            <button class="tecla" aria-label="Terminar después" onClick="{{finMas}}" style="width:44px;height:44px;border:1px solid #3A3A3A;border-radius:6px;background:#1C1B20;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
        </div>
      </sc-if>
    </section>

    <div style="width:100%;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:8px">
      <sc-for list="{{teclas}}" as="k" hint-placeholder-count="4">
        <button class="tecla" onClick="{{k.accion}}" aria-disabled="{{k.desactivada}}" aria-pressed="{{k.pulsada}}" style="height:56px;border:1px solid #CFCFCB;border-radius:6px;background:{{k.fondo}};box-shadow:0 3px 0 #CFCFCB;cursor:pointer;opacity:{{k.opacidad}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{k.icono}}"/></svg>
          <span style="font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:0.06em">{{k.etiqueta}}</span>
        </button>
      </sc-for>
    </div>
  </main>

  <div style="padding:14px 20px 22px">
    <button class="tecla" onClick="{{principal}}" style="width:100%;height:58px;border:0;border-radius:6px;background:#111111;color:#F7F7F5;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 3px 0 #5A5A5A">
      <span style="display:flex;align-items:center;gap:10px;font-family:'Martian Mono',monospace;font-size:13px;letter-spacing:0.1em"><span aria-hidden="true" style="width:9px;height:9px;border-radius:50%;background:{{ledTecla}};box-shadow:{{ledTeclaBrillo}}"></span>{{principalTxt}}</span>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{principalIcono}}"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"modo":{"editor":"enum","options":["saludo","mensaje"],"default":"saludo","section":"Variante"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fase: 'listo', t: 0, dur: 0, a: 0, b: 0, pos: 0, recorte: false, guardado: false, rm: false };
  }
  componentDidMount() {
    const rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    if (rm) this.setState({ rm: true });
  }
  componentWillUnmount() { clearInterval(this.iv); }
  tono(fs, d) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = this.ac || new AC();
      const ac = this.ac;
      fs.forEach((f, i) => {
        const t0 = ac.currentTime + i * 0.07, o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(f, t0);
        g.gain.setValueAtTime(0.1, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
        o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.02);
      });
    } catch (e) {}
  }
  grabar() {
    clearInterval(this.iv);
    this.tono([660, 990], 0.08);
    this.setState({ fase: 'grabando', t: 0, dur: 0, a: 0, b: 0, pos: 0, recorte: false, guardado: false });
    this.iv = setInterval(() => {
      const t = this.state.t + 1;
      if (t >= 200) return this.parar(200);
      this.setState({ t });
    }, 100);
  }
  parar(final) {
    clearInterval(this.iv);
    const d = Math.max(10, final || this.state.t);
    this.tono([990, 660], 0.08);
    this.setState({ fase: 'grabado', dur: d, a: 0, b: d, pos: 0, t: d });
  }
  escuchar() {
    const s = this.state;
    if (s.fase === 'reproduciendo') { clearInterval(this.iv); return this.setState({ fase: 'grabado' }); }
    if (s.fase !== 'grabado') return;
    this.setState({ fase: 'reproduciendo', pos: s.a });
    this.iv = setInterval(() => {
      const pos = this.state.pos + 1;
      if (pos >= this.state.b) { clearInterval(this.iv); return this.setState({ fase: 'grabado', pos: this.state.b }); }
      this.setState({ pos });
    }, 100);
  }
  borrar() {
    clearInterval(this.iv);
    this.setState({ fase: 'listo', t: 0, dur: 0, a: 0, b: 0, pos: 0, recorte: false, guardado: false });
  }
  mueve(campo, paso) {
    const s = this.state;
    if (s.fase !== 'grabado') return;
    if (campo === 'a') this.setState({ a: Math.min(Math.max(0, s.a + paso), s.b - 10) });
    else this.setState({ b: Math.max(Math.min(s.dur, s.b + paso), s.a + 10) });
  }
  reloj(dec) {
    const sgs = Math.ceil(dec / 10);
    return '0:' + String(sgs).padStart(2, '0');
  }
  renderVals() {
    const s = this.state, mensaje = (this.props.modo ?? 'saludo') === 'mensaje';
    const n = 40, box = 216, r = 100, MAX = 200;
    const grabando = s.fase === 'grabando', grabado = s.fase === 'grabado', sonando = s.fase === 'reproduciendo', listo = s.fase === 'listo';
    const util = s.b - s.a;
    let encendidas = n, cabeza = -1, color = '#111111';
    if (grabando) { encendidas = Math.ceil((MAX - s.t) / MAX * n); cabeza = encendidas - 1; }
    if (grabado) { encendidas = Math.round(util / MAX * n); color = '#111111'; }
    if (sonando) { encendidas = Math.round(util / MAX * n); cabeza = Math.min(encendidas - 1, Math.floor((s.pos - s.a) / MAX * n)); }
    const anillo = [];
    for (let i = 0; i < n; i++) {
      const ang = (i * 360 / n) * Math.PI / 180, esCabeza = i === cabeza, sz = esCabeza ? 10 : 7;
      let c = i < encendidas ? color : '#D6D6D2';
      if (sonando && i < cabeza) c = '#FF5B1A';
      if (esCabeza) c = '#FF5B1A';
      anillo.push({ x: Math.round(box / 2 + r * Math.sin(ang) - sz / 2), y: Math.round(box / 2 - r * Math.cos(ang) - sz / 2), s: sz, c, g: esCabeza ? '0 0 8px #FF5B1A' : 'none' });
    }
    const barras = [];
    for (let i = 0; i < n; i++) {
      const h = Math.round(18 + 78 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * 0.43)));
      const ti = i * MAX / n;
      let c = '#2E2E32', alto = 6;
      if (grabando && ti < s.t) { c = ti + MAX / n >= s.t ? '#FF5B1A' : '#F2F2F0'; alto = h; }
      if ((grabado || sonando) && ti < s.dur) { alto = h; c = ti >= s.a && ti < s.b ? '#F2F2F0' : '#5A5A5E'; if (sonando && ti >= s.a && ti < s.pos) c = '#FF5B1A'; }
      barras.push({ h: alto, c });
    }
    const ic = { play: 'M7 4l13 8-13 8z', pausa: 'M7 4h3v16H7zM14 4h3v16h-3z', tijera: 'M6 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12', papelera: 'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6', regrabar: 'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5', rec: 'M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z', parar: 'M6 6h12v12H6z', enviar: 'M5 12h14M13 6l6 6-6 6', ok: 'M5 12l5 5 9-10' };
    const activa = grabado || sonando;
    const tecla = (etiqueta, icono, accion, on, pulsada) => ({ etiqueta, icono, accion: on ? accion : () => {}, desactivada: on ? 'false' : 'true', pulsada: pulsada ? 'true' : 'false', opacidad: on ? 1 : 0.4, fondo: pulsada ? '#E4E4E0' : '#F7F7F5' });
    const teclas = [
      tecla(sonando ? 'PAUSA' : 'ESCUCHAR', sonando ? ic.pausa : ic.play, () => this.escuchar(), activa, sonando),
      tecla('RECORTAR', ic.tijera, () => this.setState({ recorte: !s.recorte }), grabado, s.recorte),
      tecla('BORRAR', ic.papelera, () => this.borrar(), activa, false),
      tecla('REGRABAR', ic.regrabar, () => this.grabar(), activa, false)
    ];
    let principalTxt = 'GRABAR', principalIcono = ic.rec, principal = () => this.grabar();
    if (grabando) { principalTxt = 'PARAR'; principalIcono = ic.parar; principal = () => this.parar(); }
    if (activa) { principalTxt = mensaje ? 'ENVIAR A ANA' : 'GUARDAR SALUDO'; principalIcono = mensaje ? ic.enviar : ic.ok; principal = () => { clearInterval(this.iv); this.tono([523, 659, 784], 0.18); this.setState({ fase: 'grabado', guardado: true, recorte: false }); }; }
    if (s.guardado) { principalTxt = mensaje ? 'ENVIADO' : 'GUARDADO'; principalIcono = ic.ok; principal = () => {}; }
    let estado = 'LISTO PARA GRABAR', etiquetaCentro = 'TIENES', cifra = '0:20', aria = 'Tienes 20 segundos';
    if (grabando) { estado = 'GRABANDO'; etiquetaCentro = 'QUEDAN'; cifra = this.reloj(MAX - s.t); aria = 'Grabando, quedan ' + Math.ceil((MAX - s.t) / 10) + ' segundos'; }
    if (grabado) { estado = s.guardado ? (mensaje ? 'ENVIADO A ANA' : 'GUARDADO EN TU PERFIL') : 'GRABADO'; etiquetaCentro = mensaje ? 'TU MENSAJE' : 'TU SALUDO'; cifra = this.reloj(util); aria = 'Grabación de ' + Math.ceil(util / 10) + ' segundos'; }
    if (sonando) { estado = 'REPRODUCIENDO'; etiquetaCentro = 'SUENA'; cifra = this.reloj(s.pos - s.a); aria = 'Reproduciendo'; }
    const led = grabando || sonando ? '#FF5B1A' : (activa ? '#F2F2F0' : '#5A5A5E');
    return {
      conAna: mensaje,
      cabecera: mensaje ? 'MENSAJE · 20 S MÁX' : 'TU SALUDO · 20 S MÁX',
      titulo: mensaje ? 'Deja un mensaje a Ana' : 'Preséntate en 20 segundos',
      guia: mensaje ? 'Cuéntale qué te apetece de mañana y cómo te va a reconocer.' : 'Cómo te llamas, qué te apetece entrenar y algo que te haga reír.',
      anillo, barras, teclas,
      giro: grabando && !s.rm ? s.t * 9 : 0,
      etiquetaCentro, cifra, ariaAnillo: aria, estado,
      led, ledBrillo: grabando || sonando ? '0 0 8px #FF5B1A' : 'none', claseLed: grabando ? 'rec' : '',
      recortando: s.recorte && grabado,
      inicioTxt: (s.a / 10).toFixed(1).replace('.', ',') + ' s', finTxt: (s.b / 10).toFixed(1).replace('.', ',') + ' s',
      inicioMenos: () => this.mueve('a', -5), inicioMas: () => this.mueve('a', 5), finMenos: () => this.mueve('b', -5), finMas: () => this.mueve('b', 5),
      principal, principalTxt, principalIcono,
      ledTecla: listo || grabando ? '#FF5B1A' : '#5A5A5A', ledTeclaBrillo: grabando ? '0 0 8px #FF5B1A' : 'none'
    };
  }
}
</script>
</body>
</html>
