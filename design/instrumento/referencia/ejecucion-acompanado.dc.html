<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Instrumento · Entreno en pareja</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@200..700&amp;family=Martian+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#111}a:hover{color:#2B4FD8}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #2B4FD8;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EEEEEC;color:#111111;font-family:'Archivo',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <header style="display:flex;align-items:center;justify-content:space-between;padding:10px 10px 4px">
    <button aria-label="Salir del entreno" style="width:44px;height:44px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <span style="font-family:'Martian Mono',monospace;font-size:11px;letter-spacing:0.08em">CIRCUITO 1 · VUELTA 2/3</span>
    <button aria-label="Voz activada" style="width:44px;height:44px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
  </header>

  <div role="img" aria-label="Progreso: paso 7 de 16" style="padding:2px 20px 10px;display:flex;flex-direction:column;gap:6px">
    <div style="display:grid;grid-template-columns:repeat(16, minmax(0, 1fr));gap:3px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="16"><div style="height:10px;background:{{s.c}};box-shadow:{{s.g}}"></div></sc-for>
    </div>
    <div style="display:flex;justify-content:space-between;font-family:'Martian Mono',monospace;font-size:9.5px;letter-spacing:0.06em;color:#5A5A5A"><span>CAL</span><span>C1</span><span>C2</span><span>FIN</span><span>ENF</span></div>
  </div>

  <main style="flex:1;display:flex;flex-direction:column;gap:12px;padding:0 20px">

    <section aria-label="Tú trabajas" style="background:#0F0E12;color:#F2F2F0;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="display:flex;align-items:center;gap:8px;font-family:'Martian Mono',monospace;font-size:11px;letter-spacing:0.1em"><span aria-hidden="true" style="width:8px;height:8px;background:#FF5B1A;box-shadow:0 0 8px #FF5B1A"></span>TÚ · TRABAJAS</span>
        <span style="font-family:'Martian Mono',monospace;font-size:10.5px;color:#9A9A9A;letter-spacing:0.06em">ESTÁNDAR</span>
      </div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between">
        <h2 style="margin:0;font-weight:250;font-size:28px;line-height:1.05;letter-spacing:-0.02em">sentadilla<br>búlgara</h2>
        <div style="display:flex;align-items:baseline;gap:4px"><span style="font-weight:200;font-size:76px;line-height:0.8;letter-spacing:-0.04em;color:#FF5B1A">10</span><span style="font-family:'Martian Mono',monospace;font-size:10px;color:#9A9A9A">REPS</span></div>
      </div>
      <p style="margin:0;font-size:14px;line-height:1.45;color:#CFCFCB">Pie de atrás en el banco. Baja recto y controlado.</p>
    </section>

    <div role="timer" aria-label="Cambiáis en 18 segundos" style="position:relative;width:196px;height:196px;align-self:center">
      <sc-for list="{{ring}}" as="dot" hint-placeholder-count="48">
        <span aria-hidden="true" style="position:absolute;left:{{dot.x}}px;top:{{dot.y}}px;width:{{dot.s}}px;height:{{dot.s}}px;border-radius:50%;background:{{dot.c}};box-shadow:{{dot.g}}"></span>
      </sc-for>
      <div aria-hidden="true" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
        <span style="font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:0.1em;color:#5A5A5A">CAMBIÁIS EN</span>
        <span style="font-weight:250;font-size:50px;line-height:1;letter-spacing:-0.03em">0:18</span>
      </div>
    </div>

    <section aria-label="Ana cuenta" style="border:1px solid #CFCFCB;background:#F7F7F5;border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start">
      <div aria-hidden="true" style="width:40px;height:40px;border-radius:6px;background:#FF5B1A;color:#111;display:flex;align-items:center;justify-content:center;font-family:'Martian Mono',monospace;font-size:14px;flex-shrink:0">A</div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-family:'Martian Mono',monospace;font-size:11px;letter-spacing:0.1em">ANA · CUENTA</span>
        <p style="margin:0;font-size:14.5px;line-height:1.45;color:#3A3A3A">Cuenta en voz alta y avísale si la rodilla se le va hacia dentro.</p>
      </div>
    </section>

    <p style="margin:0;display:flex;align-items:center;gap:6px;font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:0.06em;color:#3A3A3A"><span aria-hidden="true" style="width:7px;height:7px;background:#E0A21C;flex-shrink:0"></span>DESPUÉS · FINISHER COOPERATIVO · 30 PASES SIN QUE CAIGA</p>
  </main>

  <div style="display:flex;gap:8px;padding:14px 20px 22px">
    <button aria-label="Pausa" style="width:64px;height:60px;border:1px solid #CFCFCB;border-radius:6px;background:#F7F7F5;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #CFCFCB"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button>
    <button style="flex:1;height:60px;border:0;border-radius:6px;background:#111111;color:#F7F7F5;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 3px 0 #5A5A5A">
      <span style="font-family:'Martian Mono',monospace;font-size:13px;letter-spacing:0.1em">CAMBIAMOS</span>
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 48, lit = 29, box = 196, r = 88, ring = [];
    for (let i = 0; i < n; i++) {
      const a = (i * 360 / n) * Math.PI / 180;
      const head = i === lit - 1;
      const s = head ? 10 : 7;
      ring.push({
        x: Math.round(box / 2 + r * Math.sin(a) - s / 2),
        y: Math.round(box / 2 - r * Math.cos(a) - s / 2),
        s,
        c: head ? '#FF5B1A' : (i < lit ? '#111111' : '#CFCFCB'),
        g: head ? '0 0 8px #FF5B1A' : 'none'
      });
    }
    const steps = [];
    for (let i = 0; i < 16; i++) {
      steps.push({ c: i < 6 ? '#111111' : (i === 6 ? '#FF5B1A' : '#D6D6D2'), g: i === 6 ? '0 0 6px #FF5B1A' : 'none' });
    }
    return { ring, steps };
  }
}
</script>
</body>
</html>
