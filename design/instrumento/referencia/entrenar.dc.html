<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Instrumento · Entrenar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@200..700&amp;family=Martian+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#111}a:hover{color:#2B4FD8}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #2B4FD8;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EEEEEC;color:#111111;font-family:'Archivo',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <header style="display:flex;align-items:flex-end;justify-content:space-between;padding:22px 20px 6px">
    <h1 style="margin:0;font-weight:250;font-size:34px;letter-spacing:-0.02em;line-height:1">entrenar</h1>
    <button style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid #CFCFCB;border-radius:6px;background:#F7F7F5;cursor:pointer;font-family:'Martian Mono',monospace;font-size:11px;letter-spacing:0.06em" aria-label="Nivel: En forma. Cambiar nivel">
      <span aria-hidden="true" style="width:9px;height:9px;border-radius:50%;background:#9A9A96"></span>EN FORMA
    </button>
  </header>

  <p style="margin:0;padding:6px 20px 14px;font-family:'Martian Mono',monospace;font-size:11px;letter-spacing:0.05em;color:#5A5A5A">PINAR DE LAS ROZAS · 350 M · MAÑ 08:00</p>

  <main style="flex:1;display:flex;flex-direction:column;gap:16px;padding:0 20px">

    <section aria-label="Propuesta de hoy" style="background:#0F0E12;color:#F2F2F0;border-radius:10px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;justify-content:space-between;font-family:'Martian Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:#9A9A9A">
        <span style="display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="width:7px;height:7px;background:#FF5B1A;box-shadow:0 0 6px #FF5B1A"></span>PROPUESTA DE HOY</span><span>01/03</span>
      </div>
      <h2 style="margin:0;font-weight:250;font-size:31px;letter-spacing:-0.02em;line-height:1.05">funcional<br>en pareja</h2>
      <div role="img" aria-label="Perfil de intensidad: calentamiento suave, dos circuitos fuertes, finisher al máximo, enfriamiento suave" style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:flex-end;gap:3px;height:44px">
          <div style="flex:1;height:22%;background:#5A5A5E"></div><div style="flex:1;height:32%;background:#5A5A5E"></div>
          <div style="flex:1;height:58%;background:#FF5B1A"></div><div style="flex:1;height:72%;background:#FF5B1A"></div><div style="flex:1;height:64%;background:#FF5B1A"></div>
          <div style="flex:1;height:78%;background:#FF5B1A"></div><div style="flex:1;height:70%;background:#FF5B1A"></div><div style="flex:1;height:82%;background:#FF5B1A"></div>
          <div style="flex:1;height:100%;background:#FF5B1A"></div><div style="flex:1;height:38%;background:#5A5A5E"></div><div style="flex:1;height:20%;background:#5A5A5E"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-family:'Martian Mono',monospace;font-size:9.5px;letter-spacing:0.06em;color:#9A9A9A"><span>CAL</span><span>C1</span><span>C2</span><span>FIN</span><span>ENF</span></div>
      </div>
      <p style="margin:0;font-family:'Martian Mono',monospace;font-size:10.5px;letter-spacing:0.05em;color:#D8D8D4">25 MIN · EN FORMA · CUERPO COMPLETO · ⇄ PAREJA</p>
      <p style="margin:0;font-size:14.5px;line-height:1.45;color:#CFCFCB">El martes hiciste fuerza, y mañana vas con Ana. Este se hace mejor de dos en dos.</p>
    </section>

    <section aria-label="Ajustes" style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px">
      <sc-for list="{{knobs}}" as="k" hint-placeholder-count="3">
        <button aria-label="{{k.aria}}" style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px;background:none;border:0;cursor:pointer">
          <div aria-hidden="true" style="position:relative;width:76px;height:76px">
            <sc-for list="{{k.dots}}" as="dot" hint-placeholder-count="15">
              <span style="position:absolute;left:{{dot.x}}px;top:{{dot.y}}px;width:5px;height:5px;border-radius:50%;background:{{dot.c}};box-shadow:{{dot.g}}"></span>
            </sc-for>
            <div style="position:absolute;inset:13px;border-radius:50%;background:{{k.cap}};box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)"></div>
            <div style="position:absolute;left:36.5px;top:17px;width:3px;height:14px;border-radius:2px;background:{{k.needle}};transform-origin:1.5px 21px;transform:rotate({{k.deg}}deg)"></div>
          </div>
          <span style="font-weight:300;font-size:20px;line-height:1">{{k.value}}<span style="font-family:'Martian Mono',monospace;font-size:10px;margin-left:3px">{{k.unit}}</span></span>
          <span style="display:flex;align-items:center;gap:5px;font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:0.08em"><span style="width:7px;height:7px;background:{{k.cap}}"></span>{{k.label}}</span>
        </button>
      </sc-for>
    </section>

    <div style="display:flex;gap:8px">
      <button style="flex:1;height:58px;border:0;border-radius:6px;background:#111111;color:#F7F7F5;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 3px 0 #5A5A5A">
        <span style="font-family:'Martian Mono',monospace;font-size:13px;letter-spacing:0.1em">EMPEZAR</span>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>
      </button>
      <button style="width:96px;height:58px;border:1px solid #CFCFCB;border-radius:6px;background:#F7F7F5;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 3px 0 #CFCFCB" aria-label="Otra propuesta">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
        <span style="font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:0.08em">OTRO</span>
      </button>
    </div>
  </main>

  <nav aria-label="Principal" style="height:72px;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));border-top:1px solid #CFCFCB;background:#F7F7F5;margin-top:14px">
    <button style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;background:none;cursor:pointer;color:#5A5A5A"><span aria-hidden="true" style="width:6px;height:6px"></span><span style="font-family:'Martian Mono',monospace;font-size:10.5px;letter-spacing:0.08em">CERCA</span></button>
    <button aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;background:none;cursor:pointer;color:#111111"><span aria-hidden="true" style="width:6px;height:6px;background:#FF5B1A;box-shadow:0 0 6px #FF5B1A"></span><span style="font-family:'Martian Mono',monospace;font-size:10.5px;letter-spacing:0.08em;font-weight:600">ENTRENAR</span></button>
    <button style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;background:none;cursor:pointer;color:#5A5A5A"><span aria-hidden="true" style="width:6px;height:6px"></span><span style="font-family:'Martian Mono',monospace;font-size:10.5px;letter-spacing:0.08em">MI GENTE</span></button>
    <button style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;background:none;cursor:pointer;color:#5A5A5A"><span aria-hidden="true" style="width:6px;height:6px"></span><span style="font-family:'Martian Mono',monospace;font-size:10.5px;letter-spacing:0.08em">YO</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  knob(lit) {
    const n = 15, box = 76, r = 34, d = 5, out = [];
    for (let i = 0; i < n; i++) {
      const a = (-135 + i * (270 / (n - 1))) * Math.PI / 180;
      const head = i === lit;
      out.push({
        x: Math.round(box / 2 + r * Math.sin(a) - d / 2),
        y: Math.round(box / 2 - r * Math.cos(a) - d / 2),
        c: head ? '#FF5B1A' : (i < lit ? '#111111' : '#CFCFCB'),
        g: head ? '0 0 6px #FF5B1A' : 'none'
      });
    }
    return { dots: out, deg: -135 + lit * (270 / (n - 1)) };
  }
  renderVals() {
    const t = this.knob(8), w = this.knob(5), p = this.knob(7);
    return {
      knobs: [
        { label: 'TIEMPO', value: '25', unit: 'MIN', cap: '#2B4FD8', needle: '#FFFFFF', aria: 'Tiempo: 25 minutos. Ajustar', dots: t.dots, deg: t.deg },
        { label: 'DÓNDE', value: 'parque', unit: '', cap: '#E0A21C', needle: '#111111', aria: 'Dónde: parque. Ajustar', dots: w.dots, deg: w.deg },
        { label: 'CON QUIÉN', value: 'ana', unit: '', cap: '#FF5B1A', needle: '#111111', aria: 'Con quién: Ana. Ajustar', dots: p.dots, deg: p.deg }
      ]
    };
  }
}
</script>
</body>
</html>
